<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Notch · your list</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root { --paper: #FCFBF8; --ink: #141412; --graphite: #4A4843; --mute: #6E6B64; --rule: #DCD8CE; --brass: #8A6A22;
  --serif: 'Bodoni Moda', Georgia, serif; --text: 'Newsreader', Georgia, serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.5 var(--text); }
.wrap { max-width: 860px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top, 0px)) 20px 60px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--ink); padding-bottom: 10px; font: 13px var(--mono); color: var(--graphite); }
.top a { color: var(--brass); text-decoration: none; }
h1 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: clamp(48px, 12vw, 88px); line-height: 1; margin: 18px 0 6px; font-variation-settings: 'opsz' 60; }
h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; margin: 44px 0 4px; font-variation-settings: 'opsz' 22; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h2 .n { font: 14px var(--mono); color: var(--brass); }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
button { font: 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 10px 14px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
button:hover { background: var(--ink); color: var(--paper); }
.row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); font: 14px var(--mono); }
.row .d { color: var(--mute); white-space: nowrap; }
.row .e { overflow-wrap: anywhere; }
.fb { padding: 16px 0; border-bottom: 1px solid var(--rule); }
.fb p { margin: 0 0 8px; white-space: pre-wrap; }
.fb .meta { font: 12px/1.5 var(--mono); color: var(--mute); }
.empty, .status { font: 14px var(--mono); color: var(--mute); padding: 10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span>Only you can see this page</span><a href="/app/">Open Notch</a></div>
  <h1>Your list</h1>
  <p class="status" id="status">Loading…</p>

  <h2>Waitlist <span class="n" id="wlN"></span></h2>
  <div class="bar"><button id="copy">Copy all emails</button><button id="csv">Download CSV</button></div>
  <div id="wl"></div>

  <h2>Feedback <span class="n" id="fbN"></span></h2>
  <div id="fb"></div>
</div>
<script>
const $ = q => document.querySelector(q);
const when = s => { try { return new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return s || ''; } };
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let data = { waitlist: [], feedback: [] };
async function load() {
  try {
    const r = await fetch('/app/api/list', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 401 ? 'Not signed in. Reload the page to log in again.' : 'Couldn’t load the list.');
    data = await r.json();
    $('#status').textContent = 'Updated ' + when(new Date().toISOString());
  } catch (e) { $('#status').textContent = e.message || 'Couldn’t load the list.'; return; }
  const w = data.waitlist, f = data.feedback;
  $('#wlN').textContent = w.length + (w.length === 1 ? ' person' : ' people');
  $('#fbN').textContent = f.length + (f.length === 1 ? ' note' : ' notes');
  $('#wl').innerHTML = w.length ? w.map(x => `<div class="row"><span class="e">${esc(x.email)}</span><span class="d">${esc(when(x.at))}</span></div>`).join('') : '<p class="empty">No sign-ups yet.</p>';
  $('#fb').innerHTML = f.length ? f.map(x => `<div class="fb"><p>${esc(x.text)}</p><div class="meta">${esc(x.by)} · ${esc(when(x.at))}${x.file ? ' · ' + esc(x.file) : ''}${x.screen ? ' · ' + esc(x.screen) + (x.phone ? ' phone' : '') : ''}</div></div>`).join('') : '<p class="empty">No feedback yet.</p>';
}
$('#copy').addEventListener('click', async () => {
  const t = data.waitlist.map(x => x.email).join(', ');
  try { await navigator.clipboard.writeText(t); $('#copy').textContent = 'Copied'; } catch { prompt('Copy these:', t); }
  setTimeout(() => $('#copy').textContent = 'Copy all emails', 1500);
});
$('#csv').addEventListener('click', () => {
  const rows = [['email', 'signed up']].concat(data.waitlist.map(x => [x.email, x.at]));
  const csv = rows.map(r => r.map(v => '"' + String(v || '').replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'notch-waitlist.csv'; a.click();
});
load();
</script>
</body>
</html>
